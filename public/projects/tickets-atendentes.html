  .dxgrid table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .dxgrid th { background: #f5f5f5; font-weight: 400; color: #959595; font-size: 13px; padding: 7px 6px; text-align: center; border-bottom: 1px solid #ddd; border-right: 1px solid #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative; }
  .dxgrid th:last-child, .dxgrid td:last-child { border-right: 0; }

  .dxgrid th .sort { width: 12px; height: 12px; vertical-align: -2px; color: #666; }

  .fbox { height: 26px; border: 1px solid #ddd; border-radius: 3px; display: flex; align-items: center; padding: 0 4px; gap: 3px; color: #bbb; font-size: 11px; background: #fff; }
  .fbox svg { width: 12px; height: 12px; }
  .dxgrid td { padding: 5px 4px; text-align: center; border-bottom: 1px solid #ddd; border-right: 1px solid #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; height: 37px; }

  .pager .info { margin-right: 14px; color: #959595; }

  .navbtns { position: absolute; left: 12px; bottom: 8px; display: flex; align-items: center; gap: 2px; padding: 0 4px; background: #fff; border: 1px solid rgba(0,0,0,.15); border-radius: 5px; box-shadow: 1px 1px 1px rgba(0,0,0,.15); height: 34px; z-index: 5; }
