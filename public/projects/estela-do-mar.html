<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestão de Stock · Estela do Mar</title>
<style>
  :root {
    --bg:#f5f2ec; --card:#ffffff; --line:#e4ded3; --text:#16242f; --muted:#6b7780; --navy:#0f2636; --sea:#1d6a8a; --sea-soft:#e3f0f5;
    --ok:#2e8b57; --ok-soft:#e2f3e9; --warn:#b97800; --warn-soft:#fdf0d5; --bad:#c0392b; --bad-soft:#fbe4e1; --amber:#e0a030;
    --plate:#ffffff; --shadow:0 1px 2px rgba(15,38,54,.06), 0 4px 14px rgba(15,38,54,.06); --field:#fbfaf7;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme:light;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#0c1a24; --card:#13232f; --line:#243846; --text:#e8eef2; --muted:#93a4b0; --navy:#cfe3ee; --sea:#5fb3d3; --sea-soft:#17394a;
    --ok:#5cc58a; --ok-soft:#173a29; --warn:#e8b64a; --warn-soft:#3a2f12; --bad:#ef7d70; --bad-soft:#40201c; --amber:#e8b64a;
    --plate:#f4f1ea; --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25); --field:#0f1e29; color-scheme:dark; } }
  :root[data-theme="dark"] {
    --bg:#0c1a24; --card:#13232f; --line:#243846; --text:#e8eef2; --muted:#93a4b0; --navy:#cfe3ee; --sea:#5fb3d3; --sea-soft:#17394a;
    --ok:#5cc58a; --ok-soft:#173a29; --warn:#e8b64a; --warn-soft:#3a2f12; --bad:#ef7d70; --bad-soft:#40201c; --amber:#e8b64a;
    --plate:#f4f1ea; --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25); --field:#0f1e29; color-scheme:dark;
  }
  html { scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100%; background:var(--bg); color:var(--text); font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; font-size:14px; line-height:1.4; }
  button, input, select, textarea { font:inherit; color:inherit; }
  svg { width:20px; height:20px; fill:currentColor; flex:none; }
  .app { display:grid; grid-template-columns:248px 1fr; min-height:100vh; }

  /* sidebar */
  aside { background:var(--card); border-right:1px solid var(--line); padding:18px 14px; display:flex; flex-direction:column; gap:14px; position:sticky; top:0; height:100vh; }
  .logo { background:var(--plate); border-radius:14px; padding:10px 14px; display:grid; place-items:center; border:1px solid var(--line); }
  .logo img { width:100%; max-width:170px; height:auto; display:block; }
  nav { display:flex; flex-direction:column; gap:2px; margin-top:4px; }
  .nv { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; border:0; background:none; color:var(--muted); cursor:pointer; text-align:left; font-weight:500; }
  .nv:hover { background:var(--bg); color:var(--text); }
  .nv.on { background:var(--navy); color:var(--card); } .nv.on svg { color:var(--card); }
  .nv .cnt { margin-left:auto; background:var(--bad); color:#fff; font-size:11px; padding:1px 7px; border-radius:10px; }
  .asfoot { margin-top:auto; padding-top:12px; border-top:1px solid var(--line); font-size:12px; color:var(--muted); display:flex; flex-direction:column; gap:10px; }
  .wh { display:flex; align-items:center; gap:8px; color:var(--text); font-weight:600; }
  .user { display:flex; align-items:center; gap:10px; }
  .av { width:34px; height:34px; border-radius:50%; background:var(--sea); color:#fff; display:grid; place-items:center; font-weight:600; font-size:13px; }

  /* main */
  main { padding:24px 28px 40px; min-width:0; }
  .top { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
  h1 { font-size:24px; font-weight:700; color:var(--navy); letter-spacing:-.2px; }
  .sub { color:var(--muted); margin-top:2px; }
  .tools { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .btn { display:inline-flex; align-items:center; gap:8px; height:38px; padding:0 16px; border-radius:10px; border:1px solid var(--line); background:var(--card); cursor:pointer; font-weight:600; }
  .btn:hover { border-color:var(--sea); }
  .btn.pri { background:var(--navy); color:var(--card); border-color:var(--navy); } .btn.pri:hover { opacity:.92; }
  .btn.sea { background:var(--sea); border-color:var(--sea); color:#fff; }
  .btn.sm { height:30px; padding:0 10px; font-size:13px; border-radius:8px; }
  .btn svg { width:18px; height:18px; }
  .ibtn { width:38px; height:38px; display:grid; place-items:center; border-radius:10px; border:1px solid var(--line); background:var(--card); cursor:pointer; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); }
  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:18px; }
  .kpi { padding:16px 18px; display:flex; flex-direction:column; gap:6px; }
  .kpi .l { color:var(--muted); font-size:13px; display:flex; align-items:center; gap:8px; }
  .kpi .l i { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; background:var(--sea-soft); color:var(--sea); font-style:normal; }
  .kpi .l i svg { width:17px; height:17px; }
  .kpi .v { font-size:26px; font-weight:700; color:var(--navy); letter-spacing:-.5px; }
  .kpi .n { font-size:12px; color:var(--muted); }
  .kpi.bad .l i { background:var(--bad-soft); color:var(--bad); } .kpi.warn .l i { background:var(--warn-soft); color:var(--warn); } .kpi.ok .l i { background:var(--ok-soft); color:var(--ok); }
  .grid2 { display:grid; grid-template-columns:1.6fr 1fr; gap:14px; margin-bottom:14px; }
  .pad { padding:18px 20px; }
  .ct { font-size:15px; font-weight:700; color:var(--navy); margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; }
  .ct a { font-size:13px; font-weight:600; color:var(--sea); cursor:pointer; }
  .legend { display:flex; gap:14px; font-size:12px; color:var(--muted); } .legend span::before { content:""; display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; background:var(--c); }
  .chart { width:100%; height:auto; display:block; } .chart text { fill:var(--muted); font-size:11px; } .chart line { stroke:var(--line); }
  .alert { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); } .alert:last-child { border:0; }
  .alert .nm { flex:1; min-width:0; } .alert .nm b { display:block; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .alert .nm small { color:var(--muted); }
  .meter { height:6px; background:var(--line); border-radius:4px; overflow:hidden; margin-top:5px; } .meter i { display:block; height:100%; border-radius:4px; }

  /* tabelas */
  .tw { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); font-weight:600; padding:11px 10px; border-bottom:1px solid var(--line); white-space:nowrap; background:var(--card); }
  td { padding:11px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  tbody tr:last-child td { border-bottom:0; } tbody tr.cl { cursor:pointer; } tbody tr.cl:hover td { background:var(--bg); }
  .r { text-align:right; } .c { text-align:center; } .mono { font-variant-numeric:tabular-nums; } .mut { color:var(--muted); }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:600; }
  .pill::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .p-ok { background:var(--ok-soft); color:var(--ok); } .p-warn { background:var(--warn-soft); color:var(--warn); } .p-bad { background:var(--bad-soft); color:var(--bad); }
  .p-in { background:var(--sea-soft); color:var(--sea); } .p-out { background:var(--warn-soft); color:var(--warn); } .p-adj { background:var(--bg); color:var(--muted); border:1px solid var(--line); }
  .bar { display:flex; align-items:center; gap:10px; min-width:120px; } .bar .meter { flex:1; margin:0; } .bar b { min-width:44px; text-align:right; font-weight:600; }
  .filters { display:flex; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; align-items:center; }
  .srch { display:flex; align-items:center; gap:8px; flex:1; min-width:200px; max-width:340px; height:38px; padding:0 12px; border:1px solid var(--line); border-radius:10px; background:var(--field); color:var(--muted); }
  .srch input { border:0; outline:0; background:none; width:100%; color:var(--text); }
  select, input[type=text], input[type=number], input[type=date], textarea { height:40px; border:1px solid var(--line); border-radius:10px; background:var(--field); padding:0 12px; outline:none; width:100%; }
  textarea { height:76px; padding:10px 12px; resize:vertical; }
  select:focus, input:focus, textarea:focus { border-color:var(--sea); box-shadow:0 0 0 3px var(--sea-soft); }
  .filters select { width:auto; min-width:160px; }
  .empty { text-align:center; padding:40px; color:var(--muted); }

  /* formulários */
  .split { display:grid; grid-template-columns:420px 1fr; gap:14px; align-items:start; }
  .fg { display:grid; grid-template-columns:1fr 1fr; gap:14px 14px; } .fg .full { grid-column:1/-1; }
  .f label { display:block; font-size:13px; font-weight:600; margin-bottom:5px; } .f label .rq { color:var(--bad); }
  .f .hint { font-size:12px; color:var(--muted); margin-top:4px; } .f .er { font-size:12px; color:var(--bad); margin-top:4px; display:none; } .f.bad .er { display:block; } .f.bad input, .f.bad select { border-color:var(--bad); }
  .seg { display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; } .seg button { flex:1; height:38px; border:0; background:var(--field); cursor:pointer; font-weight:600; color:var(--muted); } .seg button.on { background:var(--navy); color:var(--card); }
  .formact { display:flex; justify-content:flex-end; gap:10px; margin-top:18px; }
  .stockinfo { background:var(--sea-soft); color:var(--sea); border-radius:10px; padding:10px 12px; font-size:13px; font-weight:600; display:flex; justify-content:space-between; }

  input.cinput { width:110px; height:34px; text-align:right; padding:0 8px; }
  .diff-0 { color:var(--muted); } .diff-p { color:var(--ok); font-weight:700; } .diff-n { color:var(--bad); font-weight:700; }

  /* modal */
  .ov { position:fixed; inset:0; background:rgba(8,20,30,.55); display:none; align-items:center; justify-content:center; z-index:30; padding:20px; }
  .ov.on { display:flex; }
  .modal { background:var(--card); border-radius:18px; width:min(640px,100%); max-height:92vh; overflow:auto; box-shadow:0 20px 60px rgba(0,0,0,.35); }
  .mh { display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--line); font-size:17px; font-weight:700; color:var(--navy); }
  .mb { padding:20px 22px; } .mf { display:flex; justify-content:flex-end; gap:10px; padding:14px 22px; border-top:1px solid var(--line); }
  .det { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:16px; } .det div { background:var(--bg); border-radius:12px; padding:10px 12px; } .det small { color:var(--muted); display:block; font-size:12px; } .det b { font-size:16px; }

  #toast { position:fixed; right:20px; bottom:20px; background:var(--navy); color:var(--card); padding:13px 18px; border-radius:12px; box-shadow:0 8px 28px rgba(0,0,0,.3); z-index:50; display:none; max-width:360px; font-weight:500; }
  #toast.bad { background:var(--bad); color:#fff; } #toast.ok { background:var(--ok); color:#fff; }
  .wm { position:fixed; right:14px; bottom:10px; font-size:11px; color:var(--muted); background:var(--card); border:1px solid var(--line); padding:2px 10px; border-radius:10px; z-index:5; }

  @media (max-width: 1100px) { .kpis { grid-template-columns:repeat(2,1fr); } .grid2, .split { grid-template-columns:1fr; } }
  @media (max-width: 820px) {
    .app { grid-template-columns:1fr; } aside { position:static; height:auto; flex-direction:column; } nav { flex-direction:row; overflow-x:auto; } .nv { white-space:nowrap; } .asfoot { display:none; }
    main { padding:16px 14px 40px; } .fg { grid-template-columns:1fr; } .wm { right:10px; } .det { grid-template-columns:1fr 1fr; }
  }
</style>
</head>

function fieldWrap(key, label, inner, err, req = true) { return `<div class="f" data-f="${key}"><label>${label}${req ? ' <span class="rq">*</span>' : ''}</label>${inner}<div class="er">${err}</div></div>`; }
function viewIn() {
  const sel = S.fIn.ref, p = pOf(sel), recent = [...MV].reverse().filter(m => m.tipo === 'Entrada').slice(0, 10);
  return head('Entradas', 'Registo e controlo de entradas de produtos') + `<div class="split"><div class="card pad"><div class="ct">Nova entrada</div><div class="fg">
    <div class="full">${fieldWrap('ref', 'Produto', prodSelect('i-ref', sel), 'Selecione um produto')}${p ? `<div class="stockinfo" style="margin-top:8px"><span>Stock atual</span><span>${fmtN(p.stock)} un. · Local ${p.loc}</span></div>` : ''}</div>
    ${fieldWrap('qty', 'Quantidade (un.)', `<input type="number" id="i-qty" min="1" placeholder="0">`, 'Indique uma quantidade superior a zero')}
    ${fieldWrap('lote', 'Lote', `<input type="text" id="i-lote" placeholder="Ex.: L26-1003">`, 'Indique o lote')}
    ${fieldWrap('val', 'Validade', `<input type="date" id="i-val" value="2030-10-03">`, 'Indique a validade')}
    ${fieldWrap('doc', 'Nº documento', `<input type="text" id="i-doc" placeholder="FT-0000">`, 'Indique o documento', false)}
    <div class="full">${fieldWrap('parte', 'Fornecedor', `<select id="i-parte">${FORN.map(x => `<option>${x}</option>`).join('')}</select>`, '', false)}</div></div>
    <div class="formact"><button class="btn" id="i-clr">Limpar</button><button class="btn sea" id="i-ok">${ic('in')} Registar entrada</button></div></div>
    <div class="card"><div class="pad" style="padding-bottom:6px"><div class="ct" style="margin:0">Entradas recentes</div></div><div class="tw"><table><thead><tr><th>Data</th><th>Produto</th><th class="r">Qtd.</th><th>Lote</th><th>Fornecedor</th></tr></thead><tbody>${recent.map(m => `<tr><td class="mono">${fmtD(m.date)}</td><td>${esc(pOf(m.ref)?.nome)}</td><td class="r mono" style="font-weight:700;color:var(--ok)">+${fmtN(m.qty)}</td><td class="mono">${m.lote}</td><td>${esc(m.parte)}</td></tr>`).join('')}</tbody></table></div></div></div>`;
}
function viewOut() {
  const sel = S.fOut.ref, p = pOf(sel), recent = [...MV].reverse().filter(m => m.tipo === 'Saída').slice(0, 10);
  return head('Saídas', 'Registo e controlo de saídas de produtos') + `<div class="split"><div class="card pad"><div class="ct">Nova saída</div><div class="fg">
    <div class="full">${fieldWrap('ref', 'Produto', prodSelect('o-ref', sel), 'Selecione um produto')}${p ? `<div class="stockinfo" style="margin-top:8px"><span>Disponível</span><span>${fmtN(p.stock)} un. · Local ${p.loc}</span></div>` : ''}</div>
    ${fieldWrap('qty', 'Quantidade (un.)', `<input type="number" id="o-qty" min="1" placeholder="0">`, 'Indique uma quantidade superior a zero')}
    ${fieldWrap('mot', 'Motivo', `<select id="o-mot">${MOTS.map(x => `<option>${x}</option>`).join('')}</select>`, '', false)}
    <div class="full">${fieldWrap('parte', 'Destino / cliente', `<select id="o-parte">${CLI.map(x => `<option>${x}</option>`).join('')}</select>`, '', false)}</div>
    ${fieldWrap('doc', 'Nº guia / fatura', `<input type="text" id="o-doc" placeholder="GR-0000">`, '', false)}</div>
    <div class="formact"><button class="btn" id="o-clr">Limpar</button><button class="btn pri" id="o-ok">${ic('out')} Registar saída</button></div></div>
    <div class="card"><div class="pad" style="padding-bottom:6px"><div class="ct" style="margin:0">Saídas recentes</div></div><div class="tw"><table><thead><tr><th>Data</th><th>Produto</th><th class="r">Qtd.</th><th>Guia</th><th>Destino</th></tr></thead><tbody>${recent.map(m => `<tr><td class="mono">${fmtD(m.date)}</td><td>${esc(pOf(m.ref)?.nome)}</td><td class="r mono" style="font-weight:700;color:var(--bad)">${fmtN(m.qty)}</td><td>${m.doc}</td><td>${esc(m.parte)}</td></tr>`).join('')}</tbody></table></div></div></div>`;
}
const nowT = () => { const d = new Date(); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
function flag(k, bad, msg) { const f = document.querySelector(`[data-f="${k}"]`); if (!f) return; f.classList.toggle('bad', bad); if (msg) f.querySelector('.er').textContent = msg; }
function bindIn() {
  $('i-ref').onchange = e => { S.fIn.ref = e.target.value; const keep = { q: $('i-qty').value, l: $('i-lote').value, d: $('i-doc').value }; render(); $('i-qty').value = keep.q; $('i-lote').value = keep.l; $('i-doc').value = keep.d; };
  $('i-clr').onclick = () => { S.fIn.ref = ''; render(); };
  $('i-ok').onclick = () => {
    const ref = $('i-ref').value, q = +$('i-qty').value, lote = $('i-lote').value.trim(), val = $('i-val').value;
    flag('ref', !ref); flag('qty', !(q > 0)); flag('lote', !lote); flag('val', !val);
    if (!ref || !(q > 0) || !lote || !val) return toast('Preencha os campos obrigatórios', 'bad');
    const p = pOf(ref); p.stock += q; p.lote = lote; p.val = val;
    MV.push({ id: SEQ++, date: TODAY, time: nowT(), tipo: 'Entrada', ref, qty: q, lote, doc: $('i-doc').value || 'S/D', parte: $('i-parte').value, user: 'María Fernández' });
    S.fIn.ref = ''; toast(`Entrada registada: +${fmtN(q)} un. de ${p.nome}`, 'ok'); render();
  };
}
function bindOut() {
  $('o-ref').onchange = e => { S.fOut.ref = e.target.value; const keep = { q: $('o-qty').value, d: $('o-doc').value }; render(); $('o-qty').value = keep.q; $('o-doc').value = keep.d; };
  $('o-clr').onclick = () => { S.fOut.ref = ''; render(); };
  $('o-ok').onclick = () => {
    const ref = $('o-ref').value, q = +$('o-qty').value, p = pOf(ref);
    flag('ref', !ref); let msg = 'Indique uma quantidade superior a zero', bad = !(q > 0);
    if (p && q > p.stock) { bad = true; msg = `Stock insuficiente: disponível ${fmtN(p.stock)} un.`; }
    flag('qty', bad, msg);
    if (!ref || bad) return toast(p && q > p.stock ? 'Stock insuficiente para esta saída' : 'Preencha os campos obrigatórios', 'bad');
    p.stock -= q;
    MV.push({ id: SEQ++, date: TODAY, time: nowT(), tipo: 'Saída', ref, qty: -q, lote: p.lote, doc: $('o-doc').value || 'S/D', parte: $('o-parte').value, user: 'María Fernández' });
    S.fOut.ref = ''; toast(`Saída registada: −${fmtN(q)} un. de ${p.nome}` + (p.stock < p.min ? ' · atenção: stock abaixo do mínimo' : ''), p.stock < p.min ? '' : 'ok'); render();
  };
}

/* ---------- Inventário ---------- */
function viewInv() {
  return head('Inventário', `Última contagem: ${fmtD(LASTINV)} · introduza as quantidades contadas e aplique os ajustes`, `<button class="btn" id="inv-fill">Preencher com stock do sistema</button><button class="btn pri" id="inv-ap">${ic('inv')} Aplicar contagem</button>`) + `<div class="card"><div class="tw"><table><thead><tr><th>Ref.</th><th>Produto</th><th>Local</th><th class="r">Stock sistema</th><th class="r">Contado</th><th class="r">Diferença</th></tr></thead><tbody>${P.map(p => { const c = S.counts[p.ref]; const df = c === undefined || c === '' ? null : +c - p.stock; return `<tr><td class="mono mut">${p.ref}</td><td style="font-weight:600">${esc(p.nome)}</td><td class="mono">${p.loc}</td><td class="r mono">${fmtN(p.stock)}</td><td class="r"><input type="number" min="0" class="cinput" data-c="${p.ref}" value="${c ?? ''}" placeholder="—"></td><td class="r mono" data-d="${p.ref}">${dfHTML(df)}</td></tr>`; }).join('')}</tbody></table></div></div>`;
}
const dfHTML = df => df === null ? '<span class="diff-0">—</span>' : df === 0 ? '<span class="diff-0">0</span>' : `<span class="${df > 0 ? 'diff-p' : 'diff-n'}">${df > 0 ? '+' : ''}${fmtN(df)}</span>`;
function bindInv() {
  document.querySelectorAll('[data-c]').forEach(i => i.oninput = () => { S.counts[i.dataset.c] = i.value; const p = pOf(i.dataset.c); document.querySelector(`[data-d="${p.ref}"]`).innerHTML = dfHTML(i.value === '' ? null : +i.value - p.stock); });
  $('inv-fill').onclick = () => { P.forEach(p => S.counts[p.ref] = String(p.stock)); render(); };
  $('inv-ap').onclick = () => {
    const ch = P.filter(p => S.counts[p.ref] !== undefined && S.counts[p.ref] !== '' && +S.counts[p.ref] !== p.stock), cnt = Object.values(S.counts).filter(v => v !== '').length;
    if (!cnt) return toast('Introduza pelo menos uma quantidade contada', 'bad');
    ch.forEach(p => { const df = +S.counts[p.ref] - p.stock; p.stock = +S.counts[p.ref]; MV.push({ id: SEQ++, date: TODAY, time: nowT(), tipo: 'Ajuste', ref: p.ref, qty: df, lote: p.lote, doc: 'INV-2026-10', parte: 'Contagem de inventário', user: 'María Fernández' }); });
    LASTINV = TODAY; S.counts = {}; toast(ch.length ? `Inventário aplicado: ${ch.length} ajuste(s) registado(s)` : 'Inventário concluído: sem diferenças', 'ok'); render();
  };
}

/* ---------- Movimentos ---------- */
function movList() { const q = S.mq.toLowerCase(); return [...MV].reverse().filter(m => (!S.mt || m.tipo === S.mt) && (!S.mp || m.ref === S.mp) && (!q || (m.doc + m.parte + (pOf(m.ref)?.nome || '') + m.ref).toLowerCase().includes(q))); }
function movTable() { const rows = movList().slice(0, 60); return `<table><thead><tr><th>Data / hora</th><th>Tipo</th><th>Produto</th><th>Lote</th><th class="r">Qtd.</th><th>Documento</th><th>Origem / destino</th><th>Utilizador</th></tr></thead><tbody>${rows.map(m => `<tr><td class="mono">${fmtD(m.date)} <span class="mut">${m.time}</span></td><td>${mpill(m.tipo)}</td><td>${esc(pOf(m.ref)?.nome)} <span class="mut">· ${m.ref}</span></td><td class="mono">${m.lote}</td><td class="r mono" style="font-weight:700;color:${m.qty > 0 ? 'var(--ok)' : 'var(--bad)'}">${m.qty > 0 ? '+' : ''}${fmtN(m.qty)}</td><td>${esc(m.doc)}</td><td>${esc(m.parte)}</td><td class="mut">${m.user}</td></tr>`).join('') || '<tr><td colspan="8" class="empty">Sem movimentos</td></tr>'}</tbody></table><div class="pad mut" style="font-size:12px">A mostrar ${Math.min(60, movList().length)} de ${movList().length} movimentos</div>`; }
function viewMov() {
  return head('Movimentos', 'Histórico e acompanhamento das movimentações de produtos') + `<div class="card"><div class="filters"><div class="srch">${ic('search', 18)}<input id="mq" placeholder="Pesquisar documento, produto, cliente…" value="${esc(S.mq)}"></div>
    <select id="mt"><option value="">Todos os tipos</option><option ${S.mt === 'Entrada' ? 'selected' : ''}>Entrada</option><option ${S.mt === 'Saída' ? 'selected' : ''}>Saída</option><option ${S.mt === 'Ajuste' ? 'selected' : ''}>Ajuste</option></select>
    <select id="mp"><option value="">Todos os produtos</option>${P.map(p => `<option value="${p.ref}" ${S.mp === p.ref ? 'selected' : ''}>${p.ref} – ${esc(p.nome)}</option>`).join('')}</select></div><div class="tw" id="mtbl">${movTable()}</div></div>`;
}
function bindMov() { const re = () => $('mtbl').innerHTML = movTable(); $('mq').oninput = e => { S.mq = e.target.value; re(); }; $('mt').onchange = e => { S.mt = e.target.value; re(); }; $('mp').onchange = e => { S.mp = e.target.value; re(); }; }

/* ---------- render ---------- */
function render() {
  renderNav();
  const v = { dash: viewDash, stock: viewStock, in: viewIn, out: viewOut, inv: viewInv, mov: viewMov }[S.view];
  $('main').innerHTML = v();
  ({ stock: bindStock, in: bindIn, out: bindOut, inv: bindInv, mov: bindMov }[S.view] || (() => { }))();
  $('main').querySelectorAll('[data-g]').forEach(b => b.onclick = () => go(b.dataset.g));
}
render();
</script>
</body>
</html>
