      ${!isNew ? `<button class="dxb" data-a="triagem" ${closed ? 'disabled' : ''}>${ic('folder', 18)} Realizar Triagem</button><button class="dxb" data-a="interact" ${closed ? 'disabled' : ''}>${ic('comment', 18)} Interagir</button><button class="dxb" data-a="log">${ic('save', 18)} Log Interações</button><button class="dxb" data-a="report">${ic('msg', 18)} Relatório</button>` : ''}
    </div></div>
    <div class="pcont"><form onsubmit="return false" novalidate>
      <div class="grp"><div class="cap">Dados do Relator</div><div class="gl c2">
        ${T(tab, 'RelatorEmail', 'E-mail do relator', { ro: blocked, req: 'É necessário digitar um email' })}${T(tab, 'RelatorNome', 'Nome do relator', { ro: blocked, req: 'É necessário digitar um relator' })}
        ${T(tab, 'RelatorTelefone', 'Telefone (DDD) + (Número)', { ro: blocked, req: 'É necessário informar um telefone' })}${T(tab, 'RelatorCelular', 'Celular (DDD) + (Número)', { ro: blocked, req: 'É necessário informar um celular' })}</div></div>
      <div class="grp"><div class="cap">Detalhes da Ocorrência</div><div class="gl c3">
        ${T(tab, 'Protocolo', 'Protocolo', { ro: true })}${T(tab, 'Motivo', 'Motivo', { type: 'select', opts: motOpts, ro: blocked, req: 'É necessário selecionar um motivo' })}${T(tab, 'Distribuidora', 'Distribuidora', { type: 'select', opts: distOpts, ro: blocked, req: 'É necessário selecionar uma distribuidora' })}
        ${T(tab, 'Status', 'Status', { type: 'select', opts: stOpts, ro: true })}${T(tab, 'NotaFiscalNumero', 'Numero da NF', { ro: nfRO, req: m && m.nf ? 'É necessário digitar uma nota fiscal' : '' })}${T(tab, 'NotaFiscalSerie', 'Serie da NF', { ro: nfRO, req: m && m.nf ? 'É necessário digitar um série de nota fiscal' : '' })}
        ${T(tab, 'InformacoesAdicionais', 'Detalhes da Ocorrência', { type: 'area', ro: blocked, req: 'É necessário digitar os detalhes da ocorrência', cls: 's3' })}
        ${T(tab, 'DataInformacaoRecebimento', 'Data de recebimento informada', { type: 'date', ro: blocked })}${T(tab, 'CCEmail', 'CC E-mail', { ro: blocked })}
        <div class="it"><label>Anexo:</label><div class="fup ${blocked ? 'dis' : ''}"><label class="fb" style="margin:0">Selecionar Anexo<input type="file" data-file="main" hidden></label><span class="fn" id="fn-main">${tab.file ? esc(tab.file) : ''}</span></div></div></div></div>
      <div class="grp"><div class="cap">Informações do Cliente</div><div class="gl c2">
        ${T(tab, 'CNPJ', 'CNPJ', { ro: closed, req: 'É obrigatório informar um CNPJ', ph: '00.000.000/0000-00' })}${T(tab, 'Cidade', 'Cidade', { ro: true, req: 'Campo obrigatório' })}
        ${T(tab, 'RazaoSocial', 'Razão Social', { ro: true, req: 'Campo obrigatório' })}${T(tab, 'Estado', 'Estado', { ro: true, req: 'Campo obrigatório' })}
        ${T(tab, 'CodigoCliente', 'Nome Fantasia', { ro: true, req: 'Campo obrigatório' })}${T(tab, 'Rede', 'Rede', { ro: true, req: 'Campo obrigatório' })}</div></div>
      <div class="grp"><div class="cap">Informações da Nota de Origem</div><div class="gl c4">
        ${T(tab, 'Serie', 'Série', { ro: true, cls: 's2' })}${T(tab, 'Vendedor', 'Cod. Vendedor', { ro: true, cls: 's2' })}${T(tab, 'DataEmissao', 'Data Emissão', { ro: true, type: 'date' })}${T(tab, 'DataRecebimento', 'Data Recebimento', { ro: true, type: 'date' })}${T(tab, 'Setor', 'Setor', { ro: true, cls: 's2' })}</div></div>
      <div class="grp"><div class="cap">Ocorrências que possuem a mesma nota</div><div id="same-host">${Grid(tab.id + '-same', { key: 'Ocorrencia', fit: true, free: true, alt: true, size: 5, sizes: [5, 10, 15], noData: 'Sem ocorrências que possuem a mesma nota', rows: () => sameNF.map(p => ({ Ocorrencia: p.Ocorrencia, Protocolo: p.Protocolo, StatusDescricao: p.StatusDescricao, MotivoDescricao: p.MotivoDescricao })),
        cols: [{ k: 'Protocolo', cap: 'Protocolo', w: '25%', hf: 1 }, { k: 'Ocorrencia', cap: 'Ocorrência', w: '15%', hf: 1 }, { k: 'StatusDescricao', cap: 'Status', w: '25%', hf: 1 }, { k: 'MotivoDescricao', cap: 'Motivo da Ocorrência', w: '35%', hf: 1 }] })}</div></div>
      <div class="grp"><div class="cap">Produtos da Ocorrência</div><div id="prod-host">${Grid(tab.id + '-prod', {
        key: 'key', select: true, fit: false, free: true, size: 5, sizes: [5, 10, 15], search: true, noData: 'Sem Produtos',
        toolbar: `<button class="dxb success" data-a="addprod" ${st !== 1 ? 'disabled' : ''}>${ic('plus', 18)} Adicionar Produtos</button><button class="dxb danger" data-a="delprod" ${st !== 1 ? 'disabled' : ''}>${ic('trash', 18)} Deletar Produtos</button>`,
        rows: () => tab.products.map(p => ({ ...p, total: (parseFloat(p.preco) || 0) * (parseFloat(p.qtdO) || 0) })),
        onEdit: (key, k, v) => { const p = tab.products.find(x => String(x.key) === String(key)); if (p) p[k] = v; },
        cols: [{ k: 'desc', cap: 'Descrição do Produto', w: 300 }, { k: 'ean', cap: 'EAN', w: 140, edit: !d.NotaFiscalNumero }, { k: 'loteNF', cap: 'Lote NF', w: 110, edit: !d.NotaFiscalNumero }, { k: 'valNF', cap: 'Validade NF', w: 120, edit: !d.NotaFiscalNumero },
          { k: 'qtdNF', cap: 'Quantidade NF', w: 130, a: 'c', edit: !d.NotaFiscalNumero }, { k: 'preco', cap: 'Preço Líquido NF', w: 140, a: 'c', render: r => brl(r.preco) }, { k: 'loteF', cap: 'Lote Físico NF', w: 130, edit: true }, { k: 'valF', cap: 'Validade Física', w: 130, edit: true },
          { k: 'qtdO', cap: 'Quantidade de Ocorrência', w: 190, a: 'c', edit: true }, { k: 'total', cap: 'Valor Total', w: 120, a: 'c', render: r => brl(r.total) }]
      })}</div></div>
    </form></div>`;
}
function renderProto(tab) {
  const host = $('view-p'), top = host.scrollTop;
  host.innerHTML = protoHTML(tab); host.scrollTop = top;
  gridMount(tab.id + '-same'); gridMount(tab.id + '-prod');
  host.querySelectorAll('[data-n]').forEach(el => {
    const n = el.dataset.n;
    el.oninput = () => { tab.data[n] = el.type === 'checkbox' ? (el.checked ? 1 : 0) : el.value; };
    el.onchange = () => {
      tab.data[n] = el.type === 'checkbox' ? (el.checked ? 1 : 0) : el.value;
      if (n === 'RelatorEmail') autoReporter(tab);
      else if (n === 'CNPJ') autoClient(tab);
      else if (n === 'Motivo' || n === 'Distribuidora' || n === 'NotaFiscalNumero' || n === 'NotaFiscalSerie') { if (n === 'Motivo') { const m = MOT.find(x => x.id == el.value); if (!m || !m.nf) { tab.data.NotaFiscalNumero = ''; tab.data.NotaFiscalSerie = ''; } } autoNote(tab); renderProto(tab); }
    };
  });
  const f = host.querySelector('[data-file="main"]'); if (f) f.onchange = () => { tab.file = f.files[0] ? f.files[0].name : ''; $('fn-main').textContent = tab.file; };
  host.querySelectorAll('[data-a]').forEach(b => b.onclick = () => actions(tab, b.dataset.a));
}
function autoReporter(tab) {
  const r = REP.find(x => x[1].toLowerCase() === String(tab.data.RelatorEmail).toLowerCase());
  if (r) { loading(400, () => { Object.assign(tab.data, { RelatorNome: r[0], RelatorTelefone: r[2], RelatorCelular: r[3] }); renderProto(tab); }); }
  else if (tab.data.RelatorEmail) toast('Relator não encontrado na base de dados', 'warning');
}
function autoClient(tab) {
  const c = CL.find(x => x[0] === tab.data.CNPJ);
  if (c) loading(400, () => { Object.assign(tab.data, { RazaoSocial: c[1], CodigoCliente: c[2], Cidade: c[3], Estado: c[4], Rede: c[5] }); renderProto(tab); });
  else if (tab.data.CNPJ) toast('CNPJ Inválido', 'error');
}
function autoNote(tab) {
  const d = tab.data; if (!(d.NotaFiscalNumero && d.NotaFiscalSerie && d.Distribuidora)) return;
  if (!tab.isNew) return;
  const c = CL.find(x => x[0] === d.CNPJ) || CL[0];
  loading(400, () => {
    Object.assign(d, { Serie: d.NotaFiscalSerie, Vendedor: '2104', DataEmissao: '28/09/2026', DataRecebimento: '30/09/2026', Setor: 'Varejo Alimentar' });
    if (!d.CNPJ) { d.CNPJ = c[0]; Object.assign(d, { RazaoSocial: c[1], CodigoCliente: c[2], Cidade: c[3], Estado: c[4], Rede: c[5] }); }
    if (!tab.products.length) tab.products = [0, 1].map(i => { const p = CAT[i + 2]; return { key: Date.now() + i, desc: p[0], ean: p[1], loteNF: p[2], valNF: '15/05/2027', qtdNF: 36, preco: p[3], loteF: '', valF: '', qtdO: '' }; });
    renderProto(tab);
  });
}
function validateForm(tab) {
  let ok = true; const host = $('view-p');
  host.querySelectorAll('[data-it]').forEach(it => {
    const msg = it.dataset.req; if (!msg) return; const inp = it.querySelector('input,select,textarea'); if (!inp || inp.classList.contains('ro') && !tab.isNew && it.dataset.it !== 'CNPJ') { it.classList.remove('bad'); return; }
    let bad = !String(tab.data[it.dataset.it] ?? '').trim(); let m = msg;
    if (!bad && it.dataset.it === 'RelatorEmail' && !/^\S+@\S+\.\S+$/.test(tab.data.RelatorEmail)) { bad = true; m = 'Digite um formato de email válido'; }
    if (inp.classList.contains('ro') && ['Cidade', 'RazaoSocial', 'Estado', 'CodigoCliente', 'Rede'].includes(it.dataset.it) === false && !bad) { }
    it.classList.toggle('bad', bad); it.querySelector('.err').textContent = m; if (bad) ok = false;
  });
  return ok;
}
function actions(tab, a) {
  if (a === 'refresh') return loading(500, () => { renderProto(tab); });
  if (a === 'report') return toast('Abriria o relatório do protocolo em nova aba', 'info');
  if (a === 'triagem') return popTriagem(tab);
  if (a === 'interact') return popInteract(tab);
  if (a === 'log') return popLog(tab);
  if (a === 'addprod') return popProducts(tab);
  if (a === 'delprod') { const g = GRID[tab.id + '-prod']; if (!g.sel.size) return toast('Selecione ao menos um produto', 'warning'); return loading(400, () => { tab.products = tab.products.filter(p => !g.sel.has(String(p.key))); g.sel.clear(); gridRefresh(tab.id + '-prod'); toast('Produtos excluidos com sucesso', 'success'); }); }
  if (a === 'save') {
    if (!validateForm(tab)) return toast('Preencha os campos obrigatórios', 'warning');
    if (tab.products.some(p => !String(p.loteF).trim() || !String(p.valF).trim() || !String(p.qtdO).trim())) return toast('É necessário preencher o Lote físico, validade física e a quantidade da ocorrência dos produtos inseridos', 'error');
    loading(700, () => {
      if (tab.isNew) {
        const m = MOT.find(x => x.id == tab.data.Motivo), id = SEQ++;
        const proto = { Ocorrencia: id, Protocolo: `SAC-2026-${String(id).padStart(4, '0')}`, NotaFiscal: tab.data.NotaFiscalNumero, Motivo: +tab.data.Motivo, MotivoDescricao: m.d, Prioritario: m.pr ? 'S' : 'N', Cliente: tab.data.CodigoCliente || '', Distribuidora: tab.data.Distribuidora, Criador: 'Ana Beatriz Souza', Status: 1, StatusDescricao: ST[1].n, RelatorNome: tab.data.RelatorNome, InformacoesAdicionais: tab.data.InformacoesAdicionais, DataAbertura: '02/10/2026 14:32', f: tab.data, products: tab.products, log: [{ reg: '02/10/2026', tipo: 'Abertura da ocorrência', obs: tab.data.InformacoesAdicionais, dep: '', data: '02/10/2026 14:32', usu: 'Ana Beatriz Souza', anexo: !!tab.file }] };
        tab.data.Protocolo = proto.Protocolo; tab.data.Status = 1; tab.isNew = false; tab.p = proto; PROTOS.push(proto);
        tab.id = '#' + proto.Protocolo; tab.title = tab.id; ACTIVE = tab.id; renderTabs();
      }
      toast('Sucesso ao salvar a ocorrencia', 'success'); renderProto(tab); gridRefresh('prior'); gridRefresh('other');
    });
  }
}

/* =============== Popups =============== */
function popup(title, body, foot, w = '95%', h = '90%', after) {
  const p = $('popup'); p.style.width = w; p.style.height = h;
  p.innerHTML = `<div class="ph"><span>${title}</span><button class="xbtn" id="px">${ic('close', 18)}</button></div><div class="pbody">${body}</div>${foot ? `<div class="pfoot">${foot}</div>` : ''}`;
  $('ov').classList.add('show'); $('px').onclick = closePop; after && after();
}
function closePop() { $('ov').classList.remove('show'); }
$('ov').onclick = e => { if (e.target === $('ov')) closePop(); };
const pfRow = (id, label, ed) => `<div class="pf" data-pf="${id}"><label>${label}:</label><div class="e">${ed}<div class="err"></div></div></div>`;
const selectHTML = (id, opts, ph = '') => `<select class="dxi" id="${id}"><option value="">${ph}</option>${opts.map(o => `<option value="${esc(o.v)}">${esc(o.t)}</option>`).join('')}</select>`;
function setBad(id, msg) { const r = document.querySelector(`[data-pf="${id}"]`); if (!r) return; r.classList.toggle('bad', !!msg); r.querySelector('.err').textContent = msg || ''; }

function popTriagem(tab) {
  const foot = `<button class="dxb" id="tLimpar">${ic('refresh', 18)} Limpar</button><button class="dxb success" id="tSalvar">${ic('check', 18)} Salvar</button>`;
  popup('Triagem de Ocorrência', pfRow('dep', 'Departamentos', selectHTML('t-dep', DEPS.map(x => ({ v: x, t: x })))) + pfRow('inf', 'Informações adicionais', `<textarea class="dxi" id="t-inf" style="height:100px"></textarea>`), foot, '95%', '90%', () => {
    $('tLimpar').onclick = () => { $('t-dep').value = ''; $('t-inf').value = ''; };
    $('tSalvar').onclick = () => {
      setBad('dep', $('t-dep').value ? '' : 'É necessário Selecionar um Departamento'); setBad('inf', $('t-inf').value.trim() ? '' : 'É necessário adicionar alguma informação adicional');
      if (!$('t-dep').value || !$('t-inf').value.trim()) return;
      const dep = $('t-dep').value, inf = $('t-inf').value; closePop();
      loading(600, () => { tab.p.log.push({ reg: '02/10/2026', tipo: 'Triagem', obs: inf, dep, data: '02/10/2026 14:40', usu: 'Ana Beatriz Souza', anexo: false }); if (tab.data.Status == 1) { tab.data.Status = 2; tab.p.Status = 2; tab.p.StatusDescricao = ST[2].n; } toast('Sucesso ao gravar a triagem', 'success'); renderProto(tab); gridRefresh('prior'); gridRefresh('other'); });
    };
  });
}
function popInteract(tab) {
  const st = { file: null, url: '' };
  const foot = `<button class="dxb" id="iLimpar">${ic('refresh', 18)} Limpar</button><button class="dxb success" id="iSalvar">${ic('check', 18)} Salvar</button>`;
  popup('Interações', `<div id="ibody"></div>`, foot, '95%', '90%', () => {
    const draw = () => {
      const ty = INTER.find(x => x.id == (st.type || 0)) || {};
      $('ibody').innerHTML = pfRow('type', 'Tipo de interação', selectHTML('i-type', INTER.map(x => ({ v: x.id, t: x.d })))) +
        pfRow('inf', 'Informações adicionais', `<textarea class="dxi" id="i-inf" style="height:100px">${esc(st.inf || '')}</textarea>`) +
        (ty.extra ? pfRow('nf', 'Chave da Nota Fiscal de Devolução', `<input class="dxi" id="i-nf" value="${esc(st.nf || '')}">`) : '') +
        (ty.reason ? pfRow('rs', 'Motivo da Interação', selectHTML('i-rs', REASONS.map(x => ({ v: x, t: x })))) : '') +
        pfRow('file', 'Anexo', `<div class="itemBorder"><div class="fup"><label class="fb" style="margin:0">Selecionar Anexo<input type="file" id="i-file" hidden></label></div>${st.file ? `<div class="attachment"><button class="dxb danger i" id="i-clr">${ic('close', 18)}</button><div class="nm">${esc(st.file.name)}</div></div>` : ''}</div>`) +
        (st.file ? `<div class="pf"><label></label><div class="e"><div class="docview">${st.file.type.startsWith('image') ? `<img src="${st.url}" alt="document-viewer">` : `<div class="ph2">${ic('img', 40)}<br>Pré-visualização do documento<br><small>${esc(st.file.name)}</small></div>`}</div></div></div>` : '');
      $('i-type').value = st.type || ''; if (ty.reason) $('i-rs').value = st.rs || '';
      $('i-type').onchange = e => { st.type = e.target.value; st.inf = $('i-inf').value; draw(); };
      $('i-inf').oninput = e => st.inf = e.target.value; if ($('i-nf')) $('i-nf').oninput = e => st.nf = e.target.value; if ($('i-rs')) $('i-rs').onchange = e => st.rs = e.target.value;
      $('i-file').onchange = e => { st.file = e.target.files[0] || null; st.url = st.file ? URL.createObjectURL(st.file) : ''; st.inf = $('i-inf').value; draw(); };
      if ($('i-clr')) $('i-clr').onclick = () => { st.file = null; draw(); };
    };
    draw();
    $('iLimpar').onclick = () => { st.type = st.inf = st.nf = st.rs = ''; st.file = null; draw(); };
    $('iSalvar').onclick = () => {
      const ty = INTER.find(x => x.id == st.type); let bad = false;
      const chk = (id, ok, msg) => { setBad(id, ok ? '' : msg); if (!ok) bad = true; };
      chk('type', !!ty, 'É necessário Selecionar um tipo de interação'); chk('inf', !!(st.inf || '').trim(), 'É necessário adicionar alguma informação adicional');
      if (ty && ty.extra) chk('nf', !!(st.nf || '').trim(), 'É necessário o número da nota fiscal'); if (ty && ty.reason) chk('rs', !!st.rs, 'É necessário Selecionar um motivo');
      if (ty && ty.attach && !st.file) { chk('file', false, 'É necessário inserir um anexo'); }
      if (bad) return toast('Preencha todos os campos', 'warning');
      closePop(); loading(700, () => {
        tab.p.log.push({ reg: '02/10/2026', tipo: ty.d, obs: st.inf, dep: '', data: '02/10/2026 14:45', usu: 'Ana Beatriz Souza', anexo: !!st.file });
        const ns = ty.id === 8 ? 4 : ty.id === 9 ? 5 : (tab.data.Status < 3 ? 3 : tab.data.Status);
        tab.data.Status = ns; tab.p.Status = ns; tab.p.StatusDescricao = ST[ns].n;
        toast('Sucesso ao gravar a interação', 'success'); renderProto(tab); gridRefresh('prior'); gridRefresh('other');
      });
    };
  });
}
function popLog(tab) {
  const id = 'log-' + tab.p.Ocorrencia;
  const toolbar = '';
  popup('Log de Interações', Grid(id, {
    key: 'i', alt: true, fit: true, search: true, toolbar: ' ', size: 10, sizes: [10, 15, 20], free: false,
    rows: () => tab.p.log.map((x, i) => ({ i, ...x })),
    cols: [{ k: 'reg', cap: 'Registro', w: '9%', a: 'c' }, { k: 'tipo', cap: 'Tipo', w: '17%', hf: 1 }, { k: 'obs', cap: 'Observação', w: '30%', render: r => `<span style="white-space:normal">${esc(r.obs)}</span>` }, { k: 'dep', cap: 'Departamentos', w: '12%', hf: 1 }, { k: 'data', cap: 'Data', w: '14%', a: 'c' }, { k: 'usu', cap: 'Usuário', w: '13%', hf: 1 },
      { cap: 'Anexo', w: '5%', a: 'c', fl: false, render: r => r.anexo ? `<button class="dxb default i" style="height:28px;width:34px" data-act="img" data-key="${r.i}">${ic('img', 16)}</button>` : '' }],
    onAct: () => toast('Abriria o anexo em nova aba', 'info')
  }), '', '95%', '90%', () => gridMount(id));
}
function popProducts(tab) {
  const id = 'pp-' + tab.id, hasNF = !!tab.data.NotaFiscalNumero;
  const catRows = CAT.map((p, i) => ({ key: i, produto: 1000 + i, desc: p[0], ean: p[1], lote: p[2] }));
  popup('Produtos', Grid(id, { key: 'key', select: true, fit: true, alt: true, size: 15, sizes: [15, 20, 30], rows: () => catRows,
    cols: hasNF ? [{ k: 'produto', cap: 'Produto', w: '12%' }, { k: 'desc', cap: 'Descrição', w: '50%' }, { k: 'ean', cap: 'EAN', w: '20%' }, { k: 'lote', cap: 'LoteNF', w: '18%' }] : [{ k: 'produto', cap: 'Produto', w: '15%' }, { k: 'desc', cap: 'Descrição', w: '85%' }] }),
    `<button class="dxb success" id="pConf">Confirmar</button>`, '95%', '90%', () => {
      gridMount(id);
      $('pConf').onclick = () => {
        const g = GRID[id]; if (!g.sel.size) return toast('Selecione ao menos um produto', 'warning');
        closePop(); loading(500, () => { [...g.sel].forEach(k => { const p = CAT[+k]; if (!tab.products.some(x => x.ean === p[1])) tab.products.push({ key: Date.now() + +k, desc: p[0], ean: hasNF ? p[1] : '', loteNF: hasNF ? p[2] : '', valNF: '', qtdNF: '', preco: p[3], loteF: '', valF: '', qtdO: '' }); }); renderProto(tab); });
      };
    });
}

/* =============== init =============== */
renderTabs(); viewMain();
</script>
