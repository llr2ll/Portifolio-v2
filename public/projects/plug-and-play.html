<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MMC Plug and Play</title>
<style>
  :root { color-scheme: light; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; }
  body { font-family: "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif; font-size: 14px; color: #333; min-width: 1100px; }
  svg { fill: currentColor; width: 20px; height: 20px; flex: none; }
  button { font-family: inherit; }
  .wm { position: fixed; right: 12px; bottom: 8px; font-size: 11px; color: rgba(0,0,0,.45); background: rgba(255,255,255,.9); border: 1px solid #eee; padding: 2px 8px; border-radius: 10px; z-index: 30; }

  /* ---------- Stepper (MUI) ---------- */
  .page { padding: 30px 8px 20px; }
  .stepper { display: flex; align-items: flex-start; width: 100%; font-family: Roboto, "Helvetica Neue", Arial, sans-serif; }
  .step { display: flex; align-items: center; cursor: pointer; padding: 8px 4px; flex: none; max-width: 190px; border-radius: 4px; }
  .step:hover { background: rgba(0,0,0,.04); }
  .dot { width: 24px; height: 24px; border-radius: 50%; background: #bdbdbd; color: #fff; font-size: 12px; display: grid; place-items: center; flex: none; margin-right: 8px; }
  .dot svg { width: 24px; height: 24px; }
  .step.active .dot, .step.done .dot { background: #0162DD; }
  .step.done .dot { background: none; color: #0162DD; }
  .step .lb { font-size: 14px; line-height: 1.2; color: rgba(0,0,0,.6); font-weight: 400; }
  .step.active .lb { color: rgba(0,0,0,.87); font-weight: 500; }
  .step.done .lb { color: rgba(0,0,0,.87); font-weight: 500; }
  .conn { flex: 1; min-width: 12px; margin-top: 20px; border-top: 1px solid #bdbdbd; }
  .stage { margin-top: 40px; }
  .stage.cfg { margin-top: 0; }

  /* ---------- DevExtreme-like widgets ---------- */
  .dxform { padding: 0 2px; }
  .grp { margin-bottom: 18px; }
  .grp > .cap { font-size: 20px; font-weight: 400; color: #333; padding: 0 0 10px; margin-bottom: 6px; border-bottom: 1px solid #ddd; }
  .grp .grp { margin: 10px 0 0 0; }
  .grp .grp > .cap { font-size: 16px; border: 0; padding-bottom: 4px; }
  .cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
  .f { display: flex; align-items: center; padding: 6px 0 10px; }
  .f.top { align-items: flex-start; }
  .f > label { width: 36%; padding-right: 12px; font-size: 14px; color: #333; }
  .f .ed { flex: 1; min-width: 0; position: relative; }
  .f .err { color: #d9534f; font-size: 11px; margin-top: 2px; display: none; } .f.bad .err { display: block; }
  .f.bad .in { border-color: #d9534f; }
  .in { width: 100%; height: 34px; border: 1px solid #d3d3d3; border-radius: 4px; padding: 7px 9px; font: 14px "Helvetica Neue", "Segoe UI", Arial, sans-serif; color: #333; background: #fff; outline: none; display: flex; align-items: center; }
  .in:focus { border-color: #337ab7; }
  .in:disabled, .in.dis { background: #f7f7f7; color: #999; border-color: #e0e0e0; }
  textarea.in { height: 150px; resize: none; line-height: 1.4; display: block; }
  select.in { appearance: none; -webkit-appearance: none; padding-right: 28px; background-image: linear-gradient(45deg, transparent 50%, #777 50%), linear-gradient(135deg, #777 50%, transparent 50%); background-position: calc(100% - 15px) 14px, calc(100% - 10px) 14px; background-size: 5px 5px; background-repeat: no-repeat; }
  .in.rel { position: relative; padding-right: 36px; }
  .eyebtn { position: absolute; right: 2px; top: 1px; width: 30px; height: 30px; display: grid; place-items: center; background: none; border: 0; cursor: pointer; color: #777; }
  .chk { width: 18px; height: 18px; accent-color: #337ab7; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 4px; border: 1px solid #ddd; background: #fff; color: #333; font-size: 14px; cursor: pointer; }
  .btn:hover { background: #f5f5f5; }
  .btn.success { background: #5cb85c; border-color: #5cb85c; color: #fff; } .btn.success:hover { background: #4cae4c; }
  .btn.big { height: 50px; width: 250px; font-weight: 700; font-size: 15px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn svg { width: 18px; height: 18px; }
  .btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
  .btns .btn { width: 120px; }
  .sw { position: relative; width: 60px; height: 24px; border-radius: 12px; background: #ddd; border: 0; cursor: pointer; color: #555; font-size: 10px; font-weight: 700; }
  .sw::after { content: attr(data-off); position: absolute; right: 8px; top: 6px; }
  .sw .knob { position: absolute; left: 2px; top: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.35); transition: left .15s; }
  .sw.on { background: #337ab7; color: #fff; } .sw.on::after { content: attr(data-on); left: 8px; right: auto; } .sw.on .knob { left: 38px; }
  .alice { background: aliceblue !important; }

  /* grid */
  .dxgrid { border: 1px solid #ddd; border-radius: 5px; background: #fff; overflow: hidden; }
  .gtool { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-bottom: 1px solid #ddd; background: #fff; }
  .gtool .title { font-size: 16px; font-weight: 500; white-space: nowrap; margin-right: auto; }
  .gsearch { display: flex; align-items: center; gap: 6px; border: 1px solid #d3d3d3; border-radius: 4px; padding: 0 8px; height: 34px; width: 220px; color: #999; }
  .gsearch input { border: 0; outline: 0; font: 14px inherit; width: 100%; color: #333; }
  .dxgrid table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .dxgrid th { background: #22317F; color: #f1f1f1; font-weight: 700; padding: 9px 8px; text-align: left; border-right: 1px solid rgba(255,255,255,.22); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative; }
  .dxgrid th:last-child { border-right: 0; }
  .dxgrid th.c, .dxgrid td.c { text-align: center; }
  .dxgrid th .hf { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 12px; height: 12px; opacity: .7; }
  .dxgrid td { padding: 9px 8px; border-top: 1px solid #ddd; border-right: 1px solid #ddd; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; height: 41px; }
  .dxgrid td:last-child { border-right: 0; }
  .dxgrid tbody tr:nth-child(even) td { background: #f7f7f7; }
  .dxgrid tbody tr:hover td { background: #eaf3fb; }
  .dxgrid .ic { color: #555; cursor: pointer; margin: 0 3px; display: inline-grid; vertical-align: middle; width: 22px; height: 22px; place-items: center; }
  .dxgrid .ic:hover { color: #337ab7; } .dxgrid .ic.del:hover { color: #d9534f; }
  .dxgrid .drag { color: #999; cursor: grab; }
  .dxgrid .empty { text-align: center; color: #999; padding: 40px; }
  .gscroll { overflow-y: auto; }
  .chkcell { width: 18px; height: 18px; accent-color: #337ab7; }
  .ok { color: #3a9e3a; } .no { color: #d9534f; }
  .inl { margin-top: 4px; }

  /* popup */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 20; }
  .overlay.show { display: flex; }
  .popup { background: #fff; border-radius: 3px; box-shadow: 0 6px 24px rgba(0,0,0,.4); max-height: 94vh; display: flex; flex-direction: column; }
  .popup .ph { display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 20px; height: 50px; border-bottom: 1px solid #ddd; font-size: 18px; flex: none; }
  .popup .pb { padding: 20px; overflow-y: auto; }
  .xbtn { width: 32px; height: 32px; display: grid; place-items: center; border: 0; background: none; cursor: pointer; color: #666; border-radius: 4px; } .xbtn:hover { background: #eee; }

  #toast { position: fixed; top: 15px; right: 10px; width: 300px; min-height: 60px; padding: 10px 14px; border-radius: 3px; color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.35); z-index: 40; display: none; align-items: center; font-size: 14px; }
  #toast.success { background: #5cb85c; } #toast.error { background: #d9534f; } #toast.warning { background: #f0ad4e; } #toast.info { background: #5bc0de; }
  .loader { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 50; display: none; align-items: center; justify-content: center; }
  .loader.show { display: flex; }
  .spin { width: 60px; height: 60px; border: 6px solid #f3f3f3; border-top-color: #3498db; border-radius: 50%; animation: sp 1s linear infinite; background: transparent; }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* editor (monaco vs-dark) */
  .mon { background: #1e1e1e; color: #d4d4d4; font: 13px/19px Consolas, "Courier New", monospace; height: 250px; border-radius: 3px; display: flex; overflow: hidden; }
  .mon .ln { color: #858585; text-align: right; padding: 6px 10px; user-select: none; background: #1e1e1e; }
  .mon pre { padding: 6px 4px; white-space: pre; overflow: auto; flex: 1; }
  .mon .k { color: #9cdcfe; } .mon .s { color: #ce9178; }
  .infobox { display: flex; justify-content: center; align-items: center; height: calc(100vh - 340px); min-height: 180px; }
  .infobox div { width: 40%; background: aliceblue; border: 1px solid #d3d3d3; border-radius: 4px; padding: 10px 12px; line-height: 1.4; }
  .checkcol { text-align: center; }
</style>
</head>
<body>
<div class="page" id="page"></div>

<div class="overlay" id="ov"><div class="popup" id="popup"></div></div>
<div id="toast"></div>
<div class="loader" id="loader"><div class="spin"></div></div>
<div class="wm">Esboço de interface · dados fictícios</div>

<script>
/* ---------- ícones ---------- */
const P = {
  edit:'M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z',
  del:'M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z',
  plus:'M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z',
  check:'M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z',
  done:'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z',
  search:'M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z',
  drag:'M3 15h18v-2H3v2zm0 4h18v-2H3v2zm0-8h18V9H3v2zm0-6v2h18V5H3z',
  close:'M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z',
  funnel:'M3 4h18l-7 8v7l-4 2v-9z'
};
const ic = (k,s=20) => `<svg viewBox="0 0 24 24" style="width:${s}px;height:${s}px"><path d="${P[k]}"/></svg>`;

/* ---------- dados fictícios ---------- */
const DB = {
  clients:[
    {id:1,NOME_FANTASIA:'Rede Farma Mais',ATIVO:false,NOME:'Rede Farma Mais Comércio de Medicamentos Ltda',EMAIL:'compras@farmamais.com.br',CNPJ:'12.345.678/0001-90',CONTATO:'Patrícia Almeida',CELULAR:'+55 (11) 98877-6655',TELEFONE:'+55 (11) 3344-5566'},
    {id:2,NOME_FANTASIA:'Drogaria Saúde Total',ATIVO:false,NOME:'Saúde Total Drogarias S.A.',EMAIL:'ti@saudetotal.com.br',CNPJ:'23.456.789/0001-01',CONTATO:'Roberto Siqueira',CELULAR:'+55 (21) 99811-2233',TELEFONE:'+55 (21) 2233-4455'},
    {id:3,NOME_FANTASIA:'Farmácias Vida e Bem',ATIVO:false,NOME:'Vida e Bem Participações Ltda',EMAIL:'contato@vidaebem.com.br',CNPJ:'34.567.890/0001-12',CONTATO:'Luciana Prado',CELULAR:'+55 (31) 98765-4321',TELEFONE:''},
    {id:4,NOME_FANTASIA:'Drogaria Central do Sul',ATIVO:true,NOME:'Central do Sul Comércio Ltda',EMAIL:'adm@centraldosul.com.br',CNPJ:'45.678.901/0001-23',CONTATO:'Marcos Teixeira',CELULAR:'+55 (51) 99654-3210',TELEFONE:'+55 (51) 3030-4040'},
    {id:5,NOME_FANTASIA:'Rede Bem Estar',ATIVO:false,NOME:'Bem Estar Farmácias Ltda',EMAIL:'sistemas@bemestar.com.br',CNPJ:'56.789.012/0001-34',CONTATO:'Helena Duarte',CELULAR:'+55 (41) 98456-7788',TELEFONE:'+55 (41) 3322-1100'}
  ],
  stores:[
    {IDENTIFICACAO:'Farma Mais – Matriz Pinheiros',CNPJ:'12.345.678/0001-90',ESTADO:'SP'},{IDENTIFICACAO:'Farma Mais – Moema',CNPJ:'12.345.678/0002-71',ESTADO:'SP'},
    {IDENTIFICACAO:'Farma Mais – Campinas Cambuí',CNPJ:'12.345.678/0003-52',ESTADO:'SP'},{IDENTIFICACAO:'Farma Mais – Santos Gonzaga',CNPJ:'12.345.678/0004-33',ESTADO:'SP'},
    {IDENTIFICACAO:'Farma Mais – Rio Copacabana',CNPJ:'12.345.678/0005-14',ESTADO:'RJ'},{IDENTIFICACAO:'Farma Mais – Niterói Icaraí',CNPJ:'12.345.678/0006-02',ESTADO:'RJ'},
    {IDENTIFICACAO:'Farma Mais – BH Savassi',CNPJ:'12.345.678/0007-85',ESTADO:'MG'},{IDENTIFICACAO:'Farma Mais – BH Lourdes',CNPJ:'12.345.678/0008-66',ESTADO:'MG'}
  ],
  suppliers:[
    {NOME_FANTASIA:'Distribuidora Alfa Medicamentos',CNPJ:'11.222.333/0001-44',ENTIDADE:'1001',OL:false},
    {NOME_FANTASIA:'Beta Pharma Distribuição',CNPJ:'22.333.444/0001-55',ENTIDADE:'1002',OL:false},
    {NOME_FANTASIA:'OL Genéricos Brasil',CNPJ:'33.444.555/0001-66',ENTIDADE:'1003',OL:true},
    {NOME_FANTASIA:'Dermacare Laboratórios',CNPJ:'44.555.666/0001-77',ENTIDADE:'1004',OL:true},
    {NOME_FANTASIA:'NutriPlus Suplementos',CNPJ:'55.666.777/0001-88',ENTIDADE:'1005',OL:false}
  ],
  ids:[
    {IDENTIFICACAO:'Farma Mais – Matriz Pinheiros',CNPJ:'12.345.678/0001-90',IDF:'FM-0001'},{IDENTIFICACAO:'Farma Mais – Moema',CNPJ:'12.345.678/0002-71',IDF:'FM-0002'},
    {IDENTIFICACAO:'Farma Mais – Campinas Cambuí',CNPJ:'12.345.678/0003-52',IDF:'FM-0003'},{IDENTIFICACAO:'Farma Mais – Rio Copacabana',CNPJ:'12.345.678/0005-14',IDF:'FM-0005'},
    {IDENTIFICACAO:'Farma Mais – BH Savassi',CNPJ:'12.345.678/0007-85',IDF:'FM-0007'}
  ],
  users:[
    {NOME:'Patrícia Almeida',EMAIL:'patricia@farmamais.com.br'},{NOME:'Carlos Eduardo Nunes',EMAIL:'carlos.nunes@farmamais.com.br'},{NOME:'Juliana Prado',EMAIL:'juliana@farmamais.com.br'}
  ],
  blocked:[{EAN:'7891234567895',FORN:'Distribuidora Alfa Medicamentos'},{EAN:'7899876543210',FORN:'Beta Pharma Distribuição'}],
  except:[{EAN:'7891112223334',PROD:'Dipirona Sódica 500mg 20 comp.',DI:'01/10/2026',DF:'31/12/2026'},{EAN:'7894445556667',PROD:'Protetor Solar FPS 50 200ml',DI:'15/10/2026',DF:'15/01/2027'}]
};
const S = { view:'mgmt', step:0, client:null, system:'', sysFields:false, tipoProc:{}, search:{}, contingencia:{1:false,2:false}, cfg:{aviseMe:false, margem:false, rank:false} };
const stepsAll = ['Cadastro do Cliente','Lojas do Cliente','Fornecedores e OL','Indentificação de Lojas nos Fornecedores','Sistema','Configurações Gerais','Aplicar Atualizações','Cadastro do Usuário'];
const $ = id => document.getElementById(id);
function toast(m,t='success'){ const e=$('toast'); e.className=t; e.textContent=m; e.style.display='flex'; clearTimeout(toast.h); toast.h=setTimeout(()=>e.style.display='none',4000); }
function loading(ms=600,cb){ $('loader').classList.add('show'); setTimeout(()=>{ $('loader').classList.remove('show'); cb&&cb(); },ms); }
function closePop(){ $('ov').classList.remove('show'); }
$('ov').onclick = e => { if(e.target===$('ov')) closePop(); };
function popup(title,body,w,bind){ $('popup').style.width = w+'px'; $('popup').innerHTML = `<div class="ph"><span>${title}</span><button class="xbtn" id="px">${ic('close',18)}</button></div><div class="pb">${body}</div>`; $('ov').classList.add('show'); $('px').onclick=closePop; bind&&bind(); }

/* ---------- helpers de formulário ---------- */
const fld = (label,{id='',v='',type='text',req=false,dis=false,opts=[],msg='',ph='',cls='',top=false}={}) => {
  let ed;
  if(type==='select') ed = `<select class="in" id="${id}" ${dis?'disabled':''}><option value=""></option>${opts.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;
  else if(type==='area') ed = `<textarea class="in ${cls}" id="${id}" readonly>${v}</textarea>`;
  else if(type==='pass') ed = `<div class="in rel ${dis?'dis':''}" style="padding:0"><input class="in" id="${id}" type="password" value="${v}" ${dis?'disabled':''} style="border:0;height:32px"><button type="button" class="eyebtn" data-eye="${id}">${ic('edit',16)}</button></div>`;
  else ed = `<input class="in ${cls}" id="${id}" type="${type}" value="${v??''}" placeholder="${ph}" ${dis?'disabled':''}>`;
  return `<div class="f ${top?'top':''}" ${id?`data-f="${id}"`:''} data-req="${req?msg||'Campo obrigatório.':''}"><label>${label}</label><div class="ed">${ed}<div class="err">${msg}</div></div></div>`;
};
const chk = (label,id,on=false) => `<div class="f"><label>${label}</label><div class="ed"><input type="checkbox" class="chk" id="${id}" ${on?'checked':''}></div></div>`;
const grp = (cap,inner,cols=2) => `<div class="grp"><div class="cap">${cap}</div><div class="${cols===2?'cols2':''}">${inner}</div></div>`;
function validate(root){
  let ok = true;
  root.querySelectorAll('[data-f]').forEach(f => {
    const msg = f.dataset.req; if(!msg) return;
    const inp = f.querySelector('input,select,textarea'); if(!inp||inp.disabled) { f.classList.remove('bad'); return; }
    let bad = !inp.value.trim();
    const em = /^\S+@\S+\.\S+$/;
    if(!bad && /email/i.test(f.dataset.f) && !em.test(inp.value)) { bad = true; f.querySelector('.err').textContent = 'Email inválido.'; }
    else if(bad) f.querySelector('.err').textContent = msg;
    f.classList.toggle('bad', bad); if(bad) ok = false;
  });
  return ok;
}
function bindEyes(root){ root.querySelectorAll('[data-eye]').forEach(b => b.onclick = () => { const i=$(b.dataset.eye); i.type = i.type==='password'?'text':'password'; }); }

/* ---------- grid ---------- */
function grid({key,title,cols,rows,addText,drag,actions,height,toolbar=true,fmt}){
  const q = (S.search[key]||'').toLowerCase();
  const data = rows.filter(r => !q || Object.values(r).join(' ').toLowerCase().includes(q));
  const w = cols.map(c=>`<col style="width:${c.w}">`).join('');
  const head = cols.map(c=>`<th class="${c.a==='c'?'c':''}">${c.cap}${c.hf?`<svg class="hf" viewBox="0 0 24 24"><path d="${P.funnel}"/></svg>`:''}</th>`).join('');
  const body = data.map((r,i)=>`<tr>${cols.map(c=>{
    let v = c.render ? c.render(r,i) : (r[c.k]??'');
    return `<td class="${c.a==='c'?'c':''}">${v}</td>`; }).join('')}</tr>`).join('') || `<tr><td colspan="${cols.length}" class="empty">Sem dados</td></tr>`;
  return `<div class="dxgrid">${toolbar?`<div class="gtool"><span class="title">${title}</span><div class="gsearch">${ic('search',16)}<input data-search="${key}" placeholder="Search..." value="${S.search[key]||''}"></div>${addText?`<button class="btn success" data-add="${key}">${ic('plus',16)} ${addText}</button>`:''}</div>`:''}
  <div class="gscroll" style="${height?`max-height:${height}`:''}"><table><colgroup>${w}</colgroup><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div></div>`;
}
const actCol = (key,w='80px',del=true) => ({cap:'',w,a:'c',render:(r,i)=>`<span class="ic" data-edit="${key}:${DB[key]?.indexOf(r)}" title="Editar">${ic('edit',18)}</span>${del?`<span class="ic del" data-del="${key}:${DB[key]?.indexOf(r)}" title="Excluir">${ic('del',18)}</span>`:''}`});

/* ---------- STEPPER ---------- */
function stepper(){
  const steps = stepsAll;
  return `<div class="stepper">${steps.map((s,i)=>`${i?'<div class="conn"></div>':''}<div class="step ${S.step===i?'active':''} ${S.step>i?'done':''}" data-s="${i}"><span class="dot">${S.step>i?ic('done',24):i+1}</span><span class="lb">${s}</span></div>`).join('')}</div>`;
}

/* ---------- Gestão de Clientes ---------- */
function viewMgmt(){
  return grid({key:'clients',title:'Gestão de Clientes',addText:'Incluir Clientes',rows:DB.clients,height:'calc(100vh - 140px)',

const titles = { stores:'Inclusão de nova loja', suppliers:'Inclusão de novo fornecedor ou OL', ids:'Inclusão de nova loja', users:'Inclusão de usuário', blocked:'Inclusão produtos bloqueio EAN', except:'Inclusão de produtos Exeção' };
function openForm(key,idx){
  const r = idx!=null && idx>=0 ? DB[key][idx] : undefined;
  const body = { stores:()=>storeForm(r), suppliers:()=>supplierForm(r), ids:idForm, users:()=>userForm(r), blocked:()=>eanForm('blocked',r), except:()=>eanForm('except',r) }[key]();
  const w = { stores:760, suppliers:1180, ids:700, users:760, blocked:700, except:760 }[key];
  popup(titles[key], body, w, () => {
    bindEyes($('popup'));
    const pc = $('pc'); if(pc) pc.onclick = closePop;
    if(key==='suppliers'){ const s=$('swp'); s.onclick = () => { s.classList.toggle('on'); const ol=s.classList.contains('on'); ['PV','BR','VM','LOGIN','SENHA'].forEach(id=>{ const e=$(id); if(e){ e.disabled=ol; if(ol) e.value=''; } }); $('EMAIL').disabled=!ol; if(!ol) $('EMAIL').value=''; }; }
    $('ps').onclick = () => {
      if(!validate($('pf'))) return toast('Preencha os campos obrigatórios','warning');
      const g = id => $(id) ? $(id).value : '';
      if(key==='stores'){ const o={IDENTIFICACAO:g('IDENTIFICACAO'),CNPJ:g('CNPJ'),ESTADO:g('ESTADO').toUpperCase()}; r?Object.assign(r,o):DB.stores.push(o); }
      if(key==='users'){ const o={NOME:g('NOME'),EMAIL:g('EMAIL')}; r?Object.assign(r,o):DB.users.push(o); }
      if(key==='ids'){ DB.ids.push({IDENTIFICACAO:'Nova loja',CNPJ:g('CNPJ'),IDF:g('IDF')||'—'}); }
      if(key==='blocked'){ DB.blocked.push({EAN:g('EAN').split(' ')[0],FORN:g('FO')}); }
      if(key==='except'){ DB.except.push({EAN:'7890000000000',PROD:g('EAN'),DI:g('DI'),DF:g('DF')}); }
      closePop(); loading(400,()=>{ toast('Registro salvo com sucesso','success'); render(); });
    };
  });
}
function bindCommon(){
  document.querySelectorAll('[data-search]').forEach(i => i.oninput = e => { S.search[i.dataset.search]=e.target.value; const p=e.target.selectionStart; render(); const n=document.querySelector(`[data-search="${i.dataset.search}"]`); n.focus(); n.setSelectionRange(p,p); });
  document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
    const k=b.dataset.add; if(k==='clients'){ S.client=null; S.view='wiz'; S.step=0; render(); } else openForm(k);
  });
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { const [k,i]=b.dataset.edit.split(':'); openForm(k,+i); });
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { const [k,i]=b.dataset.del.split(':'); popup('Confirmação',`<p style="margin-bottom:18px">Tem certeza de que deseja excluir este registro?</p><div class="btns"><button class="btn" id="n">Não</button><button class="btn success" id="y" style="background:#d9534f;border-color:#d9534f">Sim</button></div>`,380,()=>{ $('n').onclick=closePop; $('y').onclick=()=>{ DB[k].splice(+i,1); closePop(); toast('Registro removido','success'); render(); }; }); });
  document.querySelectorAll('[data-s]').forEach(s => s.onclick = () => { S.step=+s.dataset.s; render(); });
  bindEyes(document);
}
function render(){
  const page = $('page'); const y = window.scrollY;
  if(S.view==='mgmt'){
    page.style.padding='0'; page.innerHTML = `<section>${viewMgmt()}</section>`;
    document.querySelectorAll('[data-inat]').forEach(c => c.onchange = () => { DB.clients[+c.dataset.inat].ATIVO = c.checked; toast(c.checked?'Cliente inativado':'Cliente ativado','info'); });
    document.querySelectorAll('[data-editclient]').forEach(b => b.onclick = () => { S.client = DB.clients[+b.dataset.editclient]; S.view='wiz'; S.step=0; render(); });
  } else {
    page.style.padding='30px 8px 20px';
    const body = [step1,step2,step3,step4,step5,step6,step7,step8][S.step]();
    page.innerHTML = stepper() + `<div class="stage ${S.step===5?'cfg':''}">${body}</div>`;
    if(S.step===0) bind1();
    if(S.step===4){
      const sel=$('SIS'); sel.onchange = () => { S.system=sel.value; S.sysFields = sel.value===sistemas[1]; render(); };
      $('sSave').onclick = () => loading(600,()=>{ S.applyOk = false; S.step=5; render(); });
      document.querySelectorAll('[data-cont]').forEach(c => c.onchange = () => { S.contingencia[c.dataset.cont]=c.checked; const yy=window.scrollY; render(); window.scrollTo(0,yy); });
    }
    if(S.step===5) bind6();
    if(S.step===6 && $('apply')) $('apply').onclick = () => loading(900,()=>{ toast('Atualizações aplicadas com sucesso','success'); S.step=7; render(); });
    if(S.step===6) { S.applyOk = true; if(!$('apply') ) { render.once = (render.once||0)+1; } }
  }
  bindCommon();
  window.scrollTo(0,y);
}
S.applyOk = true;
render();
</script>
</body>
</html>
