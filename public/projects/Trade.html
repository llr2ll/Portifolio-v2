<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trade Marketing</title>
<style>
  :root {
    --base-bg:#fff; --side-panel-background:#f9f8f8; --card-background:#fff; --border-color:#e0e0e0;
    --base-text-color:#414141; --accent-color:#286b2a; --card-hover:#f0f9fd; --selection-bg:#e3ffe0;
    --muted:rgba(0,0,0,.54); --field-bg:rgba(0,0,0,.04); --field-line:rgba(0,0,0,.42);
    --primary:#03a9f4; --success:#4caf50; --danger:#f44336; --content-padding:16px; --page-bg:#fff;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root[data-theme="dark"] {
    --base-bg:#363640; --side-panel-background:#2c2c35; --card-background:#2c2c35; --border-color:#4a4a55;
    --base-text-color:#fff; --accent-color:#87f275; --card-hover:#14344399; --selection-bg:#2f3d2c;
    --muted:rgba(255,255,255,.6); --field-bg:rgba(255,255,255,.06); --field-line:rgba(255,255,255,.42); --page-bg:#363640;
    color-scheme:dark;
  }
  html { scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { height:100%; font-family:Roboto,"Helvetica Neue",Helvetica,Arial,sans-serif; font-size:14px; color:var(--base-text-color); background:var(--page-bg); min-width:1100px; overflow-x:auto; }
  svg { fill:currentColor; width:22px; height:22px; flex:none; }
  button { font-family:inherit; }

  /* ---------- shell ---------- */
  .app { display:flex; flex-direction:column; height:100vh; }
  header.hd { flex:none; display:flex; align-items:center; height:56px; padding:0 var(--content-padding) 0 0; background:var(--base-bg); box-shadow:0 4px 8px rgba(0,0,0,.05),0 0 4px rgba(0,0,0,.15); z-index:3; }
  .hd .menu { width:48px; height:36px; display:grid; place-items:center; color:var(--accent-color); background:none; border:0; cursor:pointer; border-radius:4px; }
  .hd .menu:hover { background:rgba(128,128,128,.12); }
  .hd .title { color:var(--accent-color); font-size:16px; font-weight:600; cursor:pointer; margin-left:4px; }
  .hd .ver { font-size:11px; margin-left:10px; opacity:.8; }
  .hd .sp { flex:1; }
  .ibtn { width:36px; height:36px; display:grid; place-items:center; background:none; border:0; border-radius:4px; cursor:pointer; color:var(--base-text-color); }
  .ibtn:hover { background:rgba(128,128,128,.14); }
  .ibtn.primary { color:var(--primary); } .ibtn.danger { color:var(--danger); }
  .body { flex:1; display:flex; min-height:0; }
  nav.side { width:250px; flex:none; display:flex; flex-direction:column; background:var(--side-panel-background); position:relative; padding-bottom:70px; overflow-y:auto; border-right:1px solid var(--border-color); transition:margin .25s; }
  nav.side.closed { margin-left:-250px; }
  .nav-item { display:flex; align-items:center; height:48px; padding:0; cursor:pointer; border-bottom:1px solid var(--border-color); font-weight:700; font-size:14px; }
  .nav-item .ic { width:48px; display:grid; place-items:center; }
  .nav-item p { flex:1; }
  .nav-item .chev { width:20px; margin-right:12px; transition:transform .2s; }
  .nav-item.open .chev { transform:rotate(90deg); }
  .nav-item:hover { background:rgba(128,128,128,.10); }
  .nav-item.sel { background:var(--accent-color); } .nav-item.sel, .nav-item.sel * { color:var(--side-panel-background); }
  .nav-sub { display:none; } .nav-sub.open { display:block; }
  .nav-sub .nav-item { font-weight:400; border-bottom:0; height:44px; padding-left:0; }
  nav.side footer { position:absolute; left:0; right:0; bottom:0; height:70px; padding:20px 0 16px 14px; font-size:12px; line-height:1.5; opacity:.75; background:var(--side-panel-background); }
  nav.side footer .lg { display:inline-block; width:13px; height:13px; border-radius:50%; background:var(--accent-color); vertical-align:-2px; }
  main.content { flex:1; min-width:0; overflow-y:auto; padding:var(--content-padding); }

  /* ---------- editores (Material, filled) ---------- */
  .row { display:flex; align-items:center; }
  .fld { position:relative; display:block; min-width:0; }
  .fld > span.lb { position:absolute; left:12px; top:5px; font-size:11px; color:var(--muted); pointer-events:none; z-index:1; }
  .fld input, .fld select, .fld textarea, .fld .ro { width:100%; height:44px; border:0; border-bottom:1px solid var(--field-line); background:var(--field-bg); color:var(--base-text-color); font:14px Roboto,Helvetica,Arial,sans-serif; padding:18px 30px 4px 12px; border-radius:4px 4px 0 0; outline:none; appearance:none; -webkit-appearance:none; }
  .fld .ro { display:flex; align-items:flex-end; padding-bottom:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:.92; }
  .fld input:focus, .fld select:focus, .fld textarea:focus { border-bottom:2px solid var(--primary); }
  .fld textarea { height:96px; padding-top:20px; resize:none; line-height:1.4; }
  .fld select:disabled { opacity:.5; cursor:not-allowed; }
  .fld.sel::after { content:""; position:absolute; right:12px; top:20px; border:solid var(--muted); border-width:0 2px 2px 0; padding:3px; transform:rotate(45deg); pointer-events:none; }
  .fld.invalid input, .fld.invalid select { border-bottom:2px solid var(--danger); background:rgba(244,67,54,.08); }
  .fld.plain input, .fld.plain select { padding-top:4px; }
  .fld.plain.sel select { padding-top:4px; }
  .fld.t input, .fld.t .ro { padding-top:4px; }
  .lab { font-size:12px; color:var(--muted); margin:0 0 3px 2px; display:block; }
  .item { display:block; }
  .item .ro, .item input, .item textarea, .item select { height:38px; padding:4px 10px; background:var(--field-bg); border:0; border-bottom:1px solid var(--field-line); border-radius:4px 4px 0 0; color:var(--base-text-color); font:14px Roboto,Helvetica,sans-serif; width:100%; outline:none; display:flex; align-items:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item textarea { height:96px; padding-top:8px; resize:none; display:block; line-height:1.4; white-space:normal; }
  .item.invalid input { border-bottom:2px solid var(--danger); background:rgba(244,67,54,.08); }
  .item .err { color:var(--danger); font-size:11px; margin-top:2px; display:none; } .item.invalid .err { display:block; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px 16px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px 16px; }
  .span2 { grid-column:span 2; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; height:36px; padding:0 18px; border:0; border-radius:4px; color:#fff; font-weight:500; font-size:14px; letter-spacing:.4px; cursor:pointer; text-transform:uppercase; }
  .btn.default { background:var(--primary); } .btn.success { background:var(--success); } .btn.danger { background:var(--danger); }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .btn.text { background:none; color:var(--base-text-color); text-transform:none; padding:0 10px; }
  .btn.text.normal { color:var(--base-text-color); } .btn.text.on { color:var(--danger); }
  .btn svg { width:22px; height:22px; }
  .page-title { display:flex; align-items:center; justify-content:space-between; }

  /* ---------- Vitrine ---------- */
  .filters { display:flex; align-items:center; gap:10px; }
  .filters .fld { flex:1; }
  .showcase-grid { display:grid; grid-template-columns:repeat(auto-fit,365px); justify-content:space-evenly; grid-auto-rows:475px; margin:15px 0; }
  .ShowCaseCard { box-shadow:0 2px 1px -1px rgba(0,0,0,.2),0 1px 1px 0 rgba(0,0,0,.14),0 1px 3px 0 rgba(0,0,0,.12); background:var(--card-background); border-radius:4px; overflow:hidden; height:447px; width:345px; letter-spacing:.01071em; line-height:1.43; font-size:.875rem; cursor:pointer; transition:box-shadow .3s; }
  .ShowCaseCard:hover { box-shadow:0 4px 10px rgba(0,0,0,.25); }
  .ShowCaseCard > header { display:flex; align-items:center; height:72px; padding:16px; }
  .avatar { width:40px; height:40px; border-radius:50%; background:#f44336; color:#fff; display:grid; place-items:center; font-size:1.25rem; margin-right:16px; flex:none; }
  .ShowCaseCard > header p { text-transform:lowercase; width:228px; white-space:normal; }
  .ShowCaseCard > main { height:324px; } .ShowCaseCard > main > img { height:194px; width:100%; display:block; object-fit:cover; }
  .ShowCaseCard > main > div { padding:16px; }
  .ShowCaseCard ul { list-style:square; padding:0 0 0 18px; }
  .ShowCaseCard li { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ShowCaseCard li strong { display:inline-block; width:127px; }
  .ShowCaseCard > footer { display:flex; align-items:center; justify-content:space-between; height:56px; padding:8px; }
  .price { width:172px; height:36px; background:var(--field-bg); border-bottom:1px solid var(--field-line); border-radius:4px 4px 0 0; text-align:right; font-weight:700; padding:0 10px; display:flex; align-items:center; justify-content:flex-end; }
  .empty { text-align:center; padding:60px; color:var(--muted); grid-column:1/-1; }

  /* ---------- item (detalhe) ---------- */
  .show-case-item { display:flex; min-height:720px; gap:10px; }
  .box { box-shadow:0 4px 4px -2px rgba(0,0,0,.3),0 3px 5px 0 rgba(0,0,0,.2),0 2px 7px 0 rgba(0,0,0,.14); padding:15px; border-radius:8px; background:var(--base-bg); }
  .show-case-item > form { width:50%; margin:5px; }
  .show-case-item > main { width:50%; margin:5px 10px 5px 0; display:flex; flex-direction:column; gap:12px; }
  .show-case-item > main img { width:100%; height:calc(100% - 307px); min-height:300px; object-fit:cover; border-radius:8px; display:block; }
  .grp-cap { font-size:18px; margin:6px 0 14px; }

  /* ---------- contratos ---------- */
  .contract-list { display:flex; flex-direction:column; gap:12px; margin:0 auto; }
  .contract-item { display:flex; box-shadow:0 2px 1px -1px rgba(0,0,0,.2),0 1px 1px 0 rgba(0,0,0,.14),0 1px 3px 0 rgba(0,0,0,.12); background:var(--base-bg); border-radius:8px; cursor:pointer; }
  .contract-item:hover { background:var(--card-hover); }
  .contract-item > div:first-child { border:1px solid var(--border-color); border-left:10px solid var(--accent-color); border-radius:8px 0 0 8px; display:grid; place-items:center; width:220px; flex:none; }
  .contract-item > div:first-child svg { width:48px; height:48px; color:var(--base-text-color); }
  .contract-item-form { border:1px solid var(--border-color); border-radius:0 8px 8px 0; padding:15px; flex:1; }
  .contract-list-header { display:flex; align-items:center; justify-content:space-between; }
  .contract-itens-list { display:grid; grid-template-columns:repeat(auto-fit,700px); justify-content:space-evenly; grid-auto-rows:270px; margin:15px; gap:0; }
  .contract-item-card { border:1px solid var(--border-color); border-bottom:10px solid var(--accent-color); border-radius:5px; background:var(--base-bg); padding:10px; display:flex; height:250px; width:680px; cursor:pointer; gap:10px; }
  .contract-item-card:hover { background:var(--card-hover); }
  .contract-item-card img { width:345px; height:100%; object-fit:cover; border-radius:3px; }
  .contract-item-card .grid2 { flex:1; align-content:start; }

  /* ---------- comprovações ---------- */
  .comm-list { display:grid; grid-template-columns:repeat(auto-fit,370px); justify-content:space-evenly; grid-auto-rows:440px; }
  .comm-item img { width:349px; height:350px; border-radius:5px 5px 0 0; display:block; object-fit:cover; }
  .comm-item .r { display:flex; gap:10px; margin-top:10px; } .comm-item .r .fld { flex:1; } .comm-item .fld.full { margin-top:10px; }

  /* ---------- planograma ---------- */
  .selects-container { display:flex; width:100%; }
  .selects-container .fld { flex:1; margin:5px; }
  .cards-container { display:flex; gap:10px; flex-wrap:wrap; padding:6px; width:100%; }
  .plan-card { flex:1 1 0; min-width:360px; margin:0; overflow:hidden; background:var(--border-color); border-bottom:1px solid #8e8e8e; }
  .plan-card h4 { padding:10px; font-size:16px; font-weight:500; margin:0; }
  .image-container { display:flex; justify-content:center; overflow:hidden; } .image-container img { max-width:800px; max-height:400px; width:100%; object-fit:contain; background:#fff; }

  /* ---------- popup / toast ---------- */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:20; }
  .overlay.show { display:flex; }
  .popup { width:700px; background:var(--base-bg); border-radius:4px; box-shadow:0 8px 24px rgba(0,0,0,.35); }
  .popup .ph { display:flex; align-items:center; justify-content:space-between; padding:6px 8px 6px 20px; border-bottom:1px solid var(--border-color); font-size:18px; height:52px; }
  .popup .pb { padding:20px; }
  #toast { position:fixed; top:68px; right:14px; min-width:300px; max-width:420px; padding:14px 16px; border-radius:3px; color:#fff; box-shadow:0 2px 8px rgba(0,0,0,.35); z-index:40; display:none; font-size:14px; }
  #toast.success { background:#4caf50; } #toast.warning { background:#ed6c02; } #toast.error { background:#f44336; }
  .wm { position:fixed; right:120px; top:20px; font-size:11px; color:var(--muted); border:1px solid var(--border-color); padding:2px 8px; border-radius:10px; z-index:5; background:var(--base-bg); }
</style>
</head>

<div class="app">
  <header class="hd">
    <button class="menu" id="menuBtn" title="Menu"><svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
    <div class="title" id="appTitle">Trade Marketing</div><div class="ver">v.0.1.0</div>

/* ---------- imagens fictícias (SVG embutido) ---------- */
function scene(seed, w=800, h=450, label='') {
  const pal = [['#1b5e20','#a5d6a7','#fff176'],['#0d47a1','#90caf9','#ffcc80'],['#b71c1c','#ef9a9a','#fff59d'],['#4a148c','#ce93d8','#80deea'],['#e65100','#ffcc80','#c5e1a5'],['#006064','#80deea','#ffab91']][seed%6];

  if (S.route==='contracts') c.querySelectorAll('.contract-item').forEach(el => el.ondblclick = () => go('contract-itens', +el.dataset.i));
  if (S.route==='contract-itens') { $('bk').onclick = back; $('rf').onclick = renderContent; c.querySelectorAll('.contract-item-card').forEach(el => el.onclick = () => go('commorvations', items.find(i=>i.id===el.dataset.id))); }
  if (S.route==='commorvations') { $('bk').onclick = back; $('rf').onclick = renderContent; $('prt').onclick = () => toast('Gerando PDF com as comprovações…','warning'); }
  c.scrollTop = top;
}
function render(){ renderNav(); $('content').scrollTop = 0; renderContent(); }
render();
</script>
</body>
</html>
